name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh release zip
      - uses: actions/upload-artifact@v4
        with:
          name: Perch
          path: build/Perch.zip
      - name: Screenshots
        run: |
          mkdir -p shots
          shoot() { # name, then arguments for Perch
            name="$1"; shift
            open build/Perch.app --args --show "$@"
            sleep "${WAIT:-6}"
            screencapture -x "shots/$name.png" || true
            pkill -x Perch || true
            sleep 1
          }
          shoot start
          WAIT=14 shoot page https://en.wikipedia.org/wiki/Menu_bar
          defaults write app.perch.browser look dark
          shoot start-dark
          defaults write app.perch.browser width -float 980
          defaults write app.perch.browser height -float 760
          WAIT=14 shoot wide-dark https://www.apple.com/
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: shots
