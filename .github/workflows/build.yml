name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 0.1.0 (leave empty to only build)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh release zip
      - uses: actions/upload-artifact@v4
        with:
          name: Perch
          path: build/Perch.zip

      - name: Screenshots
        run: |
          mkdir -p shots
          mkdir -p shots/icon && cp Icon/*.png shots/icon/
          swiftc -O scripts/window-id.swift -o build/window-id
          shoot() { # name, then arguments for Perch
            name="$1"; shift
            open build/Perch.app --args --show "$@"
            sleep "${WAIT:-6}"
            screencapture -x "shots/$name.png" || true
            id="$(build/window-id)"
            [ -n "$id" ] && screencapture -x -l"$id" "shots/$name-window.png" || true
            pkill -x Perch || true
            sleep 1
          }
          shoot start
          WAIT=14 shoot page https://en.wikipedia.org/wiki/Menu_bar
          defaults write app.perch.browser look dark
          rm -f "$HOME/Library/Application Support/Perch/session.json"
          shoot start-dark
          WAIT=14 shoot page-dark https://news.ycombinator.com/
          defaults write app.perch.browser width -float 980
          defaults write app.perch.browser height -float 760
          WAIT=14 shoot wide-dark https://www.apple.com/
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: shots

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release != '' && format('v{0}', inputs.release) || github.ref_name }}
        run: |
          gh release create "$TAG" build/Perch.zip --target "$GITHUB_SHA" \
            --title "Perch ${TAG#v}" \
            --notes "A browser that lives in your menu bar. Download Perch.zip, unzip it and move Perch to Applications. This build is not notarized yet: the first time, open it from System Settings › Privacy & Security › Open Anyway."
